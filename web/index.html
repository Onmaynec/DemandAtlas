<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>DemandAtlas — аналитика спроса</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#13161e;--panel2:#191e27;--line:#303642;--text:#f3f5f7;--muted:#9aa4b2;--accent:#96e8df;--red:#ff9eaa;--yellow:#efcf88;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}
#layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;overflow-y:auto}
aside{border-right:1px solid var(--line);padding:27px 17px;background:#0f1118;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 28px;font-size:19px;font-weight:750;letter-spacing:-.7px}
.mark{width:28px;height:28px;border:2px solid var(--accent);border-radius:9px;display:grid;place-items:center;color:var(--accent);font-weight:800}
.nav-title{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:11px 12px}
nav button{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#b5bdc8;text-align:left;padding:12px 13px;border-radius:10px;margin:3px 0}
nav button:hover,nav button.active{background:#232b31;color:var(--text)}
nav button.active{box-shadow:inset 3px 0 var(--accent)}
.side-bottom{position:absolute;bottom:22px;left:24px;right:24px;border-top:1px solid var(--line);padding-top:17px;color:var(--muted);font-size:12px}
main{min-width:0;padding:28px min(4vw,52px) 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:31px}
.breadcrumb{font-size:12px;letter-spacing:1.1px;color:var(--muted);text-transform:uppercase}
.userbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.page-title{font-size:32px;font-weight:750;letter-spacing:-1.3px;margin:0 0 4px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:27px}
.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:20px}
.panel,.stat{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:21px;min-width:0}
.stat{padding:18px 21px}
.stat .number{font-weight:700;letter-spacing:-1px;font-size:27px;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.stat .small,.muted{color:var(--muted)}
.small{font-size:12px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:17px}
.grid-even{display:grid;grid-template-columns:1fr 1fr;gap:17px}
.panel h2{font-size:16px;letter-spacing:-.2px;margin:0 0 14px}
.toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:10px;margin:0 0 18px}
label{display:block;font-size:11px;letter-spacing:.3px;color:#bdc5ce}
input,select,textarea{background:#0d1118;border:1px solid #3b4451;color:var(--text);padding:10px 11px;border-radius:9px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px #96e8df2b}
.toolbar label input,.toolbar label select{display:block;margin-top:5px}
button.primary,button.secondary,button.danger{border:1px solid var(--accent);background:var(--accent);color:#121b21;border-radius:9px;padding:10px 16px;font-weight:650}
button.secondary{background:transparent;color:var(--text);border-color:#505966}
button.danger{background:transparent;color:var(--red);border-color:#78454d}
button:hover{filter:brightness(1.12)}button:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}
th{text-align:left;font-weight:600;letter-spacing:.2px;color:#abb7c2;padding:11px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid #252a33;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}tr[data-store]{cursor:pointer}tr[data-store]:hover{background:var(--panel2)}
.table-scroll{overflow-x:auto}
.pill{border:1px solid #52605d;color:var(--accent);padding:2px 9px;border-radius:100px;font-size:11px}
.pill.error{color:var(--red);border-color:#734b51}.pill.warn{color:var(--yellow);border-color:#776745}
.notice{border-left:3px solid var(--yellow);background:#2c2618;padding:11px 14px;color:#f2dca9;border-radius:7px;margin-bottom:17px}
.errorBox{border-left:3px solid var(--red);background:#2a171c;padding:12px;color:var(--red);border-radius:7px;margin-bottom:16px}
.good{color:var(--accent)}.bad{color:var(--red)}
canvas{width:100%;height:245px;display:block}
.empty{color:var(--muted);padding:26px;text-align:center}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:14px 0}
.formgrid label input,.formgrid label select{display:block;width:100%;margin-top:5px}
details{border-top:1px solid var(--line);padding:9px 0}
summary{cursor:pointer;color:#d7dce2}
#toast{position:fixed;bottom:22px;right:25px;z-index:99;max-width:460px;padding:14px 18px;background:#202d31;border:1px solid var(--accent);border-radius:12px;display:none;box-shadow:0 14px 42px #0008}
.desktop-only{}
.interactive-row{cursor:pointer}.interactive-row:hover{background:var(--panel2)}
.filter-note{font-size:12px;color:var(--muted);margin:10px 0}.metric-number{font-weight:720;font-size:25px;letter-spacing:-.6px}
.inline-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.risk-label{padding:3px 9px;border-radius:8px;border:1px solid var(--line);font-size:11px}
.risk-label.shortage{color:var(--red);border-color:#75474c}.risk-label.overstock{color:var(--yellow);border-color:#776745}.risk-label.balanced{color:var(--accent)}
.explanation{margin-top:13px;padding:14px;border:1px dashed #47515c;border-radius:10px;color:#b5c5d0;font-size:12px}
@media(max-width:1180px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:760px){#layout{display:block}aside{height:auto;position:relative;border:0;border-bottom:1px solid var(--line);padding:13px}.brand{padding:5px 7px 9px}.nav-title,.side-bottom{display:none}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap;width:auto}main{padding:20px 14px}.topbar{align-items:start;flex-direction:column}.page-title{font-size:25px}.formgrid,.grid-even{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:no-preference){button,.panel{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div id="layout">
  <aside>
    <div class="brand"><span class="mark">D</span> DemandAtlas</div>
    <div class="nav-title">Рабочее пространство</div>
    <nav id="nav">
      <button data-view="overview" class="active">◫ &nbsp; Обзор</button>
      <button data-view="insights">▥ &nbsp; Анализ KPI</button>
      <button data-view="risks">⚑ &nbsp; Риски запасов</button>
      <button data-view="quality">▤ &nbsp; Загрузки и качество</button>
      <button data-view="forecast">⌁ &nbsp; Прогнозирование</button>
      <button data-view="plans">▣ &nbsp; Закупки и согласование</button>
      <button data-view="sources">⊞ &nbsp; Источники данных</button>
      <button data-view="catalog">≡ &nbsp; Каталог метрик</button>
    </nav>
    <div class="side-bottom">DEMAND INTELLIGENCE<br>Версия 0.3.0 • Локальная система</div>
  </aside>
  <main>
    <div class="topbar"><div class="breadcrumb">Аналитика / <span id="crumb">Обзор</span></div>
      <div class="userbar"><span class="small muted">Ключ доступа</span>
        <input id="token" aria-label="Bearer-токен" type="password" value="demo-analyst" style="width:150px" autocomplete="off">
        <button id="connect" class="secondary">Подключить</button>
        <span class="pill" id="user">—</span>
      </div>
    </div>
    <div id="content" aria-live="polite"></div>
  </main>
</div>
<div id="toast" role="status"></div>
<script>
'use strict';
const state={view:'overview',token:'demo-analyst',start:'',end:'',store:'',sku:'',catalog:null,forecastId:null,qualityRun:null,role:null,insight:{metric:'revenue',group:'store',region:'',category:'',sku:''},risk:{status:'all',lookback:28,review:7,max:60,offset:0}};
const $=id=>document.getElementById(id);
const esc=v=>String(v===null||v===undefined?'—':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(v||0));
const today=new Date();
state.end=today.toISOString().slice(0,10);
state.start=new Date(today.getTime()-29*86400000).toISOString().slice(0,10);
const headings={
 overview:['Обзор продаж','Выручка, динамика, охват и вклад подразделений'],
 insights:['Анализ KPI','Вклад магазинов и товаров в изменение показателей, фильтры и экспорт'],
 risks:['Риски запасов','Оценка дефицита и излишков на основе подтверждённых данных'],
 quality:['Загрузки и качество','Проверка происхождения данных и протокол отклонённых строк'],
 forecast:['Прогноз спроса','Сравнение baseline-моделей на исторических окнах'],
 plans:['Планирование закупок','Расчёт заказа, сценарии и утверждение решений'],
 sources:['Источники данных','Регистрация CSV и безопасных SQL-коннекторов'],
 catalog:['Каталог метрик','Определения, формулы и происхождение KPI']
};
async function api(path,method='GET',body){
 const headers={Authorization:'Bearer '+state.token};
 if(body!==undefined)headers['Content-Type']='application/json';
 const r=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});
 let data;
 try{data=await r.json()}catch{data={message:'Некорректный ответ сервера'}}
 if(!r.ok)throw Error(data.message||data.detail||'HTTP '+r.status);
 return data;
}
function toast(s,err=false){$('toast').textContent=s;$('toast').style.display='block';$('toast').style.borderColor=err?'var(--red)':'var(--accent)';setTimeout(()=>$('toast').style.display='none',4200)}
function shell(view){
 state.view=view;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 $('crumb').textContent=headings[view][0];
 $('content').innerHTML='<div class="eyebrow">DemandAtlas / Workspace</div><h1 class="page-title">'+headings[view][0]+'</h1><div class="subtitle">'+headings[view][1]+'</div><div id="body"><div class="empty">Загрузка данных...</div></div>';
}
function error(e){$('body').innerHTML='<div class="errorBox">'+esc(e.message)+'</div>';}
function options(values,selected){return values.map(v=>'<option value="'+esc(v.id)+'"'+(v.id===selected?' selected':'')+'>'+esc(v.label)+'</option>').join('')}
function table(headers,rows){return '<div class="table-scroll"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function card(title,content){return '<section class="panel"><h2>'+esc(title)+'</h2>'+content+'</section>'}
function dateBar(){return '<div class="toolbar"><label>Начало<input type="date" id="start" value="'+esc(state.start)+'"></label><label>Конец<input type="date" id="end" value="'+esc(state.end)+'"></label><label>Магазин<select id="storeFilter">'+options([{id:'',label:'Все магазины'},...((state.catalog?.stores||[]).map(s=>({id:s.id,label:s.name})))],state.store)+'</select></label><button class="primary" id="refresh">Применить</button></div>'}
async function overview(){
 const q=new URLSearchParams({start:state.start,end:state.end,group_by:'date'});
 if(state.store)q.set('store',state.store);
 const c=new URLSearchParams({start:state.start,end:state.end,group_by:'store'});
 if(state.store)c.set('store',state.store);
 const [sales,comp]=await Promise.all([api('/api/v1/metrics/sales?'+q),api('/api/v1/metrics/compare?'+c)]);
 const rows=sales.rows, rev=rows.reduce((s,r)=>s+r.revenue,0),units=rows.reduce((s,r)=>s+r.units,0),margin=rows.reduce((s,r)=>s+r.margin,0);
 const cov=sales.coverage;
 const stats=[['Выручка',money(rev)+' ₽','По опубликованным данным'],['Продажи',money(units),'Штук за период'],['Маржа',money(margin)+' ₽','Выручка за вычетом себестоимости'],['Охват',cov.storeCoveragePct===null?'—':cov.storeCoveragePct+'%','Дней × магазинов']];
 const statHtml='<div class="cards">'+stats.map(s=>'<div class="stat"><div class="small muted">'+s[0]+'</div><div class="number">'+esc(s[1])+'</div><div class="small muted">'+s[2]+'</div></div>').join('')+'</div>';
 const coverageNote=cov.incomplete?'<div class="notice">Неполный охват: '+cov.observedStoreDays+' из '+cov.expectedStoreDays+' магазин-дней. Показатели не отражают полную сеть. <button class="secondary" id="coverageDetails">Показать пропуски</button></div>':'';
 const contribution=comp.contributions.sort((a,b)=>Math.abs(b.absoluteChange)-Math.abs(a.absoluteChange)).slice(0,12);
 $('body').innerHTML=dateBar()+coverageNote+statHtml+'<div class="grid2">'+card('Динамика выручки','<canvas id="salesChart" aria-label="График выручки по датам" role="img"></canvas>'+table(['Дата','Выручка','Продажи'],rows.map(r=>'<tr><td>'+esc(r.dimension)+'</td><td>'+money(r.revenue)+'</td><td>'+money(r.units)+'</td></tr>')))+card('Изменение к прошлому периоду','<div class="number" style="font-size:28px">'+money(comp.absoluteChange)+' ₽</div><p class="'+(comp.absoluteChange>=0?'good':'bad')+'">'+(comp.percentChange===null?'Нет базы для сравнения':comp.percentChange+'% к прошлому периоду')+'</p>'+table(['Магазин','Вклад, ₽'],contribution.map(x=>'<tr data-store="'+esc(x.dimension)+'"><td>'+esc(x.dimension)+'</td><td>'+money(x.absoluteChange)+'</td></tr>'))+'<p class="small muted">Нажмите магазин для drill-down. Применённые даты сохраняются.</p>')+'</div><div id="coverageOutput"></div><p class="small muted">Версия набора: '+sales.datasetVersion+' · Последняя публикация: '+esc(cov.lastPublishedAt)+' · Формулы доступны в каталоге метрик.</p>';
 attachDate();
 if($('coverageDetails'))$('coverageDetails').onclick=async()=>{
  try{
   const params=new URLSearchParams({start:state.start,end:state.end});
   if(state.store)params.set('store',state.store);
   const c=await api('/api/v1/metrics/coverage?'+params);
   const rows=c.missing.slice(0,200).map(x=>'<tr><td>'+esc(x.storeId)+'</td><td>'+esc(x.date)+'</td></tr>');
   $('coverageOutput').innerHTML=card('Пропущенные магазин-дни · '+c.missing.length,table(['Магазин','Дата'],rows)+(c.missing.length>200?'<p>Показаны первые 200 пропусков.</p>':''));
  }catch(e){toast(e.message,true)}
 };
 document.querySelectorAll('tr[data-store]').forEach(tr=>tr.onclick=()=>{state.store=tr.dataset.store;overview().catch(error)});
 drawChart('salesChart',rows);
}
function attachDate(){
 $('refresh').onclick=()=>{state.start=$('start').value;state.end=$('end').value;state.store=$('storeFilter').value;overview().catch(error)};
}
function drawChart(id,rows){
 const canvas=$(id),ctx=canvas.getContext('2d'),w=canvas.clientWidth,h=245,dpr=window.devicePixelRatio||1;
 canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);
 const data=rows.map(x=>x.revenue),max=Math.max(...data,1),left=10,top=12,height=200;
 ctx.strokeStyle='#343d49';ctx.lineWidth=1;
 for(let i=0;i<5;i++){let y=top+i*height/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-6,y);ctx.stroke()}
 if(!data.length)return;
 const step=(w-22)/data.length;
 data.forEach((v,i)=>{const bar=Math.max(1,(v/max)*(height-14));ctx.fillStyle='#96e8df';ctx.fillRect(left+i*step,top+height-bar,Math.max(1,step-2),bar)});
}
function safeParams(path,values){
 const params=new URLSearchParams();
 Object.entries(values).forEach(([k,v])=>{
  if(v!==null&&v!==undefined&&v!=='')params.set(k,String(v));
 });
 return path+'?'+params.toString();
}
function getInsightFilters(){
 const i=state.insight;
 return {start:state.start,end:state.end,store:state.store||null,
         region:i.region||null,category:i.category||null,sku:i.sku||null};
}
async function downloadReport(ext){
 try{
  const params=getInsightFilters();
  const url=safeParams('/api/v1/reports/sales.'+ext,params);
  const res=await fetch(url,{headers:{Authorization:'Bearer '+state.token}});
  if(!res.ok){
   let data={};try{data=await res.json()}catch{}
   throw Error(data.message||'Ошибка выгрузки '+res.status);
  }
  const file=await res.blob();
  const object=URL.createObjectURL(file);
  const link=document.createElement('a');
  link.href=object;link.download='demandatlas-sales.'+ext;
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(object),2500);
  toast('Отчёт '+ext.toUpperCase()+' сформирован');
 }catch(e){toast(e.message,true)}
}
async function insights(){
 const f=getInsightFilters(),i=state.insight;
 const params={...f,metric:i.metric,group_by:i.group,limit:100};
 const data=await api(safeParams('/api/v1/insights/contributions',params));
 const categories=[...new Set((state.catalog?.products||[]).map(x=>x.category))].sort();
 const stores=(state.catalog?.stores||[]).map(s=>({id:s.id,label:s.name}));
 const filterControls='<div class="toolbar">'+
  '<label>С<input id="iStart" type="date" value="'+esc(state.start)+'"></label>'+
  '<label>По<input id="iEnd" type="date" value="'+esc(state.end)+'"></label>'+
  '<label>Показатель<select id="iMetric">'+options([{id:'revenue',label:'Выручка'}, {id:'margin',label:'Маржа'}, {id:'units',label:'Количество'}],i.metric)+'</select></label>'+
  '<label>Группировка<select id="iGroup">'+options([{id:'store',label:'Магазины'}, {id:'region',label:'Регионы'}, {id:'category',label:'Категории'}, {id:'sku',label:'SKU'}],i.group)+'</select></label>'+
  '<label>Магазин<select id="iStore">'+options([{id:'',label:'Все доступные'},...stores],state.store)+'</select></label>'+
  '<label>Регион<input id="iRegion" value="'+esc(i.region)+'" placeholder="Все регионы" style="width:120px"></label>'+
  '<label>Категория<select id="iCategory">'+options([{id:'',label:'Все доступные'},...categories.map(x=>({id:x,label:x}))],i.category)+'</select></label>'+
  '<label>SKU<input id="iSku" value="'+esc(i.sku)+'" placeholder="Все товары" style="width:140px"></label>'+
  '<button id="iApply" class="primary">Применить</button>'+
  '<button id="iReset" class="secondary">Сбросить</button></div>';
 const suffix=i.metric==='units'?' шт.':' ₽';
 const totalPct=data.percentChange===null?'Нет базы для процента':data.percentChange+'%';
 const stats='<div class="cards">'+[
  ['Сейчас',money(data.currentTotal)+suffix],
  ['Ранее',money(data.previousTotal)+suffix],
  ['Изменение',money(data.absoluteChange)+suffix],
  ['Изменение, %',totalPct],
 ].map(x=>'<div class="stat"><div class="small muted">'+x[0]+'</div><div class="metric-number">'+esc(x[1])+'</div></div>').join('')+'</div>';
 const coverage=data.coverage;
 const incomplete=coverage.current.incomplete||coverage.previous.incomplete;
 const info=(incomplete?'<div class="notice">Охват данных неполный: текущий '+esc(coverage.current.coveragePct)+'%, прошлый '+esc(coverage.previous.coveragePct)+'%. Сравнивайте показатели с осторожностью.</div>':'')+
  '<p class="filter-note">Версия '+data.datasetVersion+' · Ранее: '+esc(data.previousPeriod.start)+' — '+esc(data.previousPeriod.end)+' · '+data.totalDimensions+' измерений</p>';
 const rows=data.contributions.map((x,index)=>{
  const css=x.absoluteChange<0?'bad':'good';
  return '<tr class="interactive-row" data-insight="'+index+'"><td>'+esc(x.dimension)+'</td>'+
   '<td>'+money(x.current)+'</td><td>'+money(x.previous)+'</td>'+
   '<td class="'+css+'">'+money(x.absoluteChange)+'</td>'+
   '<td>'+ (x.shareOfChangePct===null?'—':money(x.shareOfChangePct)+'%')+'</td></tr>'
 });
 if(data.totalDimensions>data.returnedDimensions)rows.push('<tr><td>Прочие ('+(data.totalDimensions-data.returnedDimensions)+')</td><td>—</td><td>—</td><td>'+money(data.otherChange)+'</td><td>—</td></tr>');
 const explanation='<div class="explanation">'+esc(data.method)+
  ' Сумма изменений по всем измерениям'+(data.reconciled?' равна изменению общего показателя.':' не согласована — проверьте данные.')+
  ' Доля вклада не вычисляется, если общая дельта равна нулю.</div>';
 const actions='<div class="inline-actions" style="margin-bottom:15px"><button class="secondary" id="exportCsv">Экспорт CSV</button><button class="primary" id="exportXlsx">Экспорт XLSX</button><span class="small muted">Файлы содержат только доступные строки, максимум 10 000 SKU.</span></div>';

function parseLocalCSV(input){
 const cells=[],lines=[];let value='',row=[],quoted=false;
 for(let i=0;i<input.length;i++){
  const c=input[i];
  if(quoted){
   if(c==='"'&&input[i+1]==='"'){value+='"';i++}
   else if(c==='"')quoted=false;
   else value+=c;
  }else if(c==='"')quoted=true;
  else if(c===','){row.push(value);value=''}
  else if(c==='\n'){row.push(value.replace(/\r$/,''));lines.push(row);row=[];value=''}
  else value+=c;
 }
 if(quoted)throw Error('Некорректная кавычка в CSV');
 if(row.length||value){row.push(value.replace(/\r$/,''));lines.push(row)}
 if(lines.length===0)throw Error('CSV пустой');
 const headers=lines.shift().map((v,i)=>i===0?v.replace(/^\uFEFF/,''):v);
 if(!headers.includes('transaction_id')||!headers.includes('sku')||!headers.includes('date'))throw Error('Нет обязательных колонок transaction_id, sku, date');
 if(lines.length>100000)throw Error('CSV превышает 100 000 строк');
 return lines.filter(x=>x.some(v=>v!=='')).map(x=>{
  if(x.length!==headers.length)throw Error('Неверное число столбцов CSV');
  return Object.fromEntries(headers.map((h,i)=>[h,x[i]]))
 });
}
