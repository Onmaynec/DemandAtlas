name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Syntax, unresolved references
        run: ruff check backend forecast_service tests --select E4,E7,E9,F63,F7,F82
      - name: Unit and SQLite integration tests
        env:
          DEMO_MODE: "1"
          FORECAST_URL: ""
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: SPA JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          js = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/demandatlas-spa.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/demandatlas-spa.js
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t demandatlas:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated stack
        run: |
          cp .env.example .env
          docker compose -f compose.yml up --build -d
      - name: Seed synthetic catalog and verify API
        run: |
          docker compose -f compose.yml exec -T api python -m backend.scripts.seed_demo --rows 300 --seed 42
          docker compose -f compose.yml exec -T api python -m backend.scripts.smoke_postgres
          docker compose -f compose.yml exec -T api python -m backend.scripts.smoke_insights
          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent -H "Authorization: Bearer demo-analyst" \
            http://127.0.0.1:8000/api/v1/metrics/catalog | python -c "import sys,json; assert 'margin' in json.load(sys.stdin)"
          curl --fail --silent -X POST http://127.0.0.1:8000/api/v1/forecasts/backtest \
            -H "Authorization: Bearer demo-analyst" -H "Content-Type: application/json" \
            -d '{"storeId":"S001","sku":"SKU00001","horizon":28}' | python -c "import sys,json; assert json.load(sys.stdin)['winner']"
      - name: Diagnose and stop
        if: always()
        run: |
          docker compose -f compose.yml ps || true
          docker compose -f compose.yml logs --no-color --tail=100 || true
          docker compose -f compose.yml down -v || true
