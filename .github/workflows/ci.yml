name: CI
on:
  push:
    branches: [main, feat/initial-product]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Syntax, unresolved references
        run: ruff check backend forecast_service tests --select E4,E7,E9,F63,F7,F82
      - name: Unit and SQLite integration tests
        env:
          DEMO_MODE: "1"
          FORECAST_URL: ""
          PYTHONPATH: .
        run: python -m pytest -q tests
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t demandatlas:ci .
